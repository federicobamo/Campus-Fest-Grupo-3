<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFest 2026 — Login administrador</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
 
  <div style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div class="modal-card" style="max-width: 400px;">
      <div class="modal-header">
        <h3 style="font-size: 18px;">Acceso administrador</h3>
      </div>
 
      <form id="formLogin">
        <div class="form-group">
          <label for="correoLogin">Correo institucional <span class="required">*</span></label>
          <input type="email" id="correoLogin" placeholder="usuario@ucenfotec.ac.cr" required>
        </div>
 
        <p id="loginError" style="display:none; color:#c0392b; font-size:13px; margin-top:-8px;"></p>
 
        <button type="submit" class="btn btn-primary" style="width:100%;">Ingresar</button>
      </form>
    </div>
  </div>
 
  <script src="js/login-admin.js"></script>
</body>
</html>
